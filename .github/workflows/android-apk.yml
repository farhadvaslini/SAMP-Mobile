name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-build-workflow

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342"
          yes | sdkmanager --licenses

      - name: Prepare temporary signing key
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../keys"
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/../keys/new.jks" \
            -storepass 123123 \
            -alias key0 \
            -keypass 123123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Temporary Android Build"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
